# OBS Acceptance-Criteria registry.
# Maps phase acceptance criteria to their verifying test (node id) or marks them
# as infrastructure-validated (checked via the azure-lifecycle-operator during
# the per-phase cloud validation loop, not by automated unit/integration tests).
# `make ac-coverage` fails if any automated AC has no collectable test.

phase_0:
  - id: AC-P0-HEALTH
    description: >-
      CI/CD deploys a stub FastAPI app to Azure App Service returning HTTP 200
      on a health endpoint (Build Sequencing Plan v1.2 §4.0.4).
    test: backend/tests/unit/test_health.py::test_health_returns_200
  - id: AC-P0-SCHEMA
    description: >-
      All obs.* tables exist in the obs schema with correct schemas and are
      queryable (Build Sequencing Plan v1.2 §4.0.4).
    test: backend/tests/unit/test_schema_bootstrap.py::test_all_required_tables_exist
  - id: AC-P0-SCHEMA-QUERYABLE
    description: Every obs.* table is queryable and starts empty.
    test: backend/tests/unit/test_schema_bootstrap.py::test_every_table_is_queryable
  - id: AC-P0-AUDIT-APPENDONLY
    description: >-
      obs.audit_log is append-only via a PostgreSQL BEFORE UPDATE OR DELETE
      trigger (Build Sequencing Plan v1.2 §4.0.4; Architecture Spec v3.6 §7).
    verification: infra   # validated against PostgreSQL in the cloud loop
  - id: AC-P0-BLOB
    description: Blob containers (landing, archive, error) accessible to Functions MI.
    verification: infra
  - id: AC-P0-KEYVAULT
    description: Key Vault provisioned; App Service & Functions MIs have read access.
    verification: infra
  - id: AC-P0-ENTRA
    description: Entra ID app registration exists with correct local/prod redirect URIs.
    verification: infra
